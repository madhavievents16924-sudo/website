<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="white"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" stroke="#38B6FF" stroke-width="4" fill="none"/>
  <!-- Body of running waiter - simplified flat fill -->
  <circle cx="38" cy="34" r="6" fill="#38B6FF"/>
  <!-- Hair flowing -->
  <path d="M33 29 Q26 24 30 20 Q34 16 38 20" stroke="#38B6FF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Torso -->
  <path d="M38 40 L42 58 L52 56" stroke="#38B6FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arm holding tray -->
  <path d="M40 48 L58 36" stroke="#38B6FF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Cloche (serving lid) -->
  <path d="M52 28 C52 22 70 22 70 28 Z" fill="#38B6FF"/>
  <rect x="50" y="28" width="22" height="3" rx="1.5" fill="#38B6FF"/>
  <circle cx="61" cy="22" r="2.5" fill="#38B6FF"/>
  <!-- Steam from cloche -->
  <path d="M57 20 Q60 15 57 11" stroke="#38B6FF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M63 21 Q66 16 63 12" stroke="#38B6FF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Flame/drop in other hand -->
  <path d="M34 52 Q28 56 32 62 Q36 68 40 62 Q44 56 38 52 Z" fill="#38B6FF"/>
  <!-- Legs running -->
  <path d="M42 58 L28 72 L20 68" stroke="#38B6FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M42 58 L54 70 L64 66" stroke="#38B6FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Motion lines -->
  <line x1="12" y1="68" x2="18" y2="68" stroke="#38B6FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="74" x2="17" y2="74" stroke="#38B6FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>